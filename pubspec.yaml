name: aniview
description: An Android-first anime library and personal media player.
publish_to: none
version: 0.2.5+7

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.1
  go_router: 17.2.3
  dio: 5.9.2
  drift: 2.33.0
  sqlite3: 3.3.3
  path: 1.9.1
  path_provider: 2.1.6
  crypto: 3.0.7
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  flutter_secure_storage: 10.0.0
  html: 0.15.7
  xml: 7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.33.0
  build_runner: 2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/fonts/
    - assets/licenses/
